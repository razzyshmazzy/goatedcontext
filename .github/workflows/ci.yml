name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # let every OS report, even if one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node is the production runtime; pin the engines baseline so the
      # Node-runtime test exercises the minimum supported version.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducibility with local dev; bump deliberately.
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # better-sqlite3 is the Node backend; rebuild its native addon against this
      # runner's Node ABI so the published-CLI path is genuinely exercised.
      - name: Rebuild native SQLite for Node
        run: npm rebuild better-sqlite3

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun test
