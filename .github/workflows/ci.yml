name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # let every OS report, even if one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node is the production runtime. Use a version that ships the built-in
      # node:sqlite (the engines baseline is >=22.13); 24 is the local dev version.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducibility with local dev; bump deliberately.
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

  # Exercise the BUILT CLI on plain Node (no Bun) across the supported matrix,
  # so the published node:sqlite runtime is genuinely tested — not simulated.
  node-runtime:
    name: node-runtime (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Drive the built bundle with the real `node` binary in an isolated CTX_HOME.
      # No native addon is installed, so this must work with node:sqlite alone.
      - name: Run built CLI on Node
        shell: bash
        env:
          # Unique per matrix cell so parallel jobs never share a SQLite file.
          CTX_HOME: ${{ runner.temp }}/ctx-home-${{ matrix.node }}
          CTX_SECRET_BACKEND: file
        run: |
          set -e
          node dist/index.js --version
          node dist/index.js init
          node dist/index.js status
          # `--skip-adapter` omits the optional Claude-adapter checks (absent on a
          # bare runner) while STILL failing on real DB/runtime/config errors, so
          # this stays a genuine gate rather than an ignored exit code.
          node dist/index.js doctor --skip-adapter --json > /dev/null
          echo '{"cwd":".","prompt":"install a package dependency"}' | node dist/index.js hook claude-prompt
          node dist/index.js stats
